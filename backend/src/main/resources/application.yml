server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: classroom-pulse
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/classroom_pulse?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 12
      minimum-idle: 2
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  jwt:
    secret: ${JWT_SECRET:}
    expiration-hours: ${JWT_EXPIRATION_HOURS:168}
  upload:
    dir: ${UPLOAD_DIR:./data/uploads}
    max-bytes: 10485760
  bootstrap:
    teacher-username: ${BOOTSTRAP_TEACHER_USERNAME:}
    teacher-password: ${BOOTSTRAP_TEACHER_PASSWORD:}
    teacher-name: ${BOOTSTRAP_TEACHER_NAME:教师}
  admin:
    initial-username: ${BOOTSTRAP_ADMIN_USERNAME:}
    initial-password: ${BOOTSTRAP_ADMIN_PASSWORD:}
    initial-name: ${BOOTSTRAP_ADMIN_NAME:系统管理员}
    session-hours: ${ADMIN_SESSION_HOURS:8}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}

logging:
  level:
    root: INFO
    com.classpulse: INFO
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
