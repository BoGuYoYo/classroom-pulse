<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>课脉 · 管理后台</title>
  <link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
  <div id="login-screen" class="login-screen">
    <div class="login-aside">
      <div class="brand-mark">课脉<span>CLASS PULSE</span></div>
      <div class="login-copy">
        <div class="eyebrow">ADMIN CONSOLE</div>
        <h1>把课堂，<br>照看得更清楚。</h1>
        <p>账号、课程与成员管理集中在这里。教学内容保持只读，课堂由教师掌控。</p>
      </div>
      <div class="login-rule"></div>
      <p class="login-foot">管理员入口独立鉴权 · 会话受 CSRF 保护</p>
    </div>
    <div class="login-panel">
      <form id="login-form" class="login-form" autocomplete="off">
        <div class="eyebrow">SECURE SIGN IN</div>
        <h2>管理员登录</h2>
        <p class="muted">使用服务器私有配置初始化的管理员账号。</p>
        <label>管理员账号<input id="login-username" name="username" required autocomplete="username"></label>
        <label>密码<input id="login-password" name="password" type="password" required autocomplete="current-password"></label>
        <div id="login-error" class="form-error" hidden></div>
        <button class="btn btn-primary btn-block" id="login-submit" type="submit">进入管理后台</button>
      </form>
    </div>
  </div>

  <div id="app" class="shell" hidden>
    <aside class="sidebar">
      <div class="brand-mark brand-mark-dark">课脉<span>CLASS PULSE</span></div>
      <div class="sidebar-label">管理台</div>
      <nav class="nav">
        <button class="nav-item active" data-route="dashboard" onclick="setRoute('dashboard')"><span>01</span>总览</button>
        <button class="nav-item" data-route="accounts" onclick="setRoute('accounts')"><span>02</span>账号</button>
        <button class="nav-item" data-route="courses" onclick="setRoute('courses')"><span>03</span>课程</button>
      </nav>
      <div class="sidebar-bottom">
        <div id="admin-meta" class="admin-meta"></div>
        <button class="text-btn" onclick="logout()">安全退出</button>
      </div>
    </aside>
    <main class="main">
      <header class="topbar">
        <div>
          <div id="page-kicker" class="eyebrow">OVERVIEW</div>
          <h1 id="page-title">总览</h1>
          <p id="page-sub" class="muted"></p>
        </div>
        <div class="topbar-actions">
          <span id="sync-state" class="sync-state">自动刷新 · 5s</span>
          <button class="icon-btn" id="refresh-btn" title="立即刷新" onclick="refreshRoute(true)">↻</button>
        </div>
      </header>
      <section id="content" class="content"></section>
    </main>
  </div>

  <div id="modal-root"></div>
  <div id="toast" class="toast" hidden></div>
  <script src="/admin/admin.js"></script>
</body>
</html>
