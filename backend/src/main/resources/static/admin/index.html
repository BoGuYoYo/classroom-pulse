<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>课脉 · 管理后台</title>
  <link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
  <div id="app" class="shell" hidden>
    <aside class="sidebar">
      <div class="brand-mark brand-mark-dark">课脉<span>CLASS PULSE</span></div>
      <div class="sidebar-label">管理台</div>
      <nav class="nav">
        <button class="nav-item active" data-route="dashboard" onclick="setRoute('dashboard')"><span>01</span>总览</button>
        <button class="nav-item" data-route="accounts" onclick="setRoute('accounts')"><span>02</span>账号</button>
        <button class="nav-item" data-route="courses" onclick="setRoute('courses')"><span>03</span>课程</button>
      </nav>
      <div class="sidebar-bottom">
        <div id="admin-meta" class="admin-meta"></div>
        <button class="text-btn" onclick="logout()">安全退出</button>
      </div>
    </aside>
    <main class="main">
      <header class="topbar">
        <div>
          <div id="page-kicker" class="eyebrow">OVERVIEW</div>
          <h1 id="page-title">总览</h1>
          <p id="page-sub" class="muted"></p>
        </div>
        <div class="topbar-actions">
          <span id="sync-state" class="sync-state">自动刷新 · 5s</span>
          <button class="icon-btn" id="refresh-btn" title="立即刷新" onclick="refreshRoute(true)">↻</button>
        </div>
      </header>
      <section id="content" class="content"></section>
    </main>
  </div>

  <div id="modal-root"></div>
  <div id="toast" class="toast" hidden></div>
  <script src="/admin/admin.js"></script>
</body>
</html>
